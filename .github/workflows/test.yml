name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # The suite covers the rules, the server's authority over them, the bot,
      # Elo, accounts and storage. It needs no services and no network.
      - run: npm test
