# Deploy config for Render (https://render.com).
#
# Point Render at this repo (New → Blueprint) and it reads this file.
# WebSockets work on every plan, including free.
#
# ─────────────────────────────────────────────────────────────────────────
# Keeping accounts and ratings on the free plan
#
# The free plan wipes the filesystem whenever the instance restarts, and a free
# instance restarts every time it goes idle. To keep player records, create a
# free Redis database at upstash.com and add these two variables in the Render
# dashboard (Environment tab) after the first deploy:
#
#   UPSTASH_REDIS_REST_URL
#   UPSTASH_REDIS_REST_TOKEN
#
# They are secrets, so they are set in the dashboard rather than committed here.
# With both present the server stores player data in Upstash; without them it
# falls back to a local file. Games themselves work either way.
# ─────────────────────────────────────────────────────────────────────────
services:
  - type: web
    name: guardian-chess
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
